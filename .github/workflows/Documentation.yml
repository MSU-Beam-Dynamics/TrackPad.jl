name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      # Deploys to the gh-pages branch with the workflow's own token (the
      # `contents: write` permission above is what allows the push). Set a
      # DOCUMENTER_KEY repository secret (DocumenterTools.genkeys) only if the
      # docs push must trigger other workflows or target another repository.
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
